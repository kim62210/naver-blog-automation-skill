<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: ${font_family}; line-height: ${line_height}; max-width: 700px; margin: 0 auto; padding: 20px; }
    h1 { font-size: ${title_size}px; font-weight: bold; margin-bottom: 20px; }
    h2 { font-size: ${title_medium_size}px; font-weight: bold; margin: 32px 0 16px; }
    h3 { font-size: ${title_small_size}px; font-weight: bold; margin: 24px 0 12px; }
    p { font-size: ${body_size}px; margin: 12px 0; }
    blockquote { border-left: 4px solid #4A90D9; padding-left: 16px; color: #555; margin: 16px 0; }
    .highlight-quote { background: #f0f7ff; padding: 16px; border-radius: 8px; border-left: none; }
    hr { border: none; border-top: 1px solid #ddd; margin: 24px 0; }
    .thick-hr { border-top: 3px solid #333; }
    table { border-collapse: collapse; width: 100%; margin: 16px 0; }
    th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    th { background: #f5f5f5; font-weight: bold; }
    .cta { font-size: 24px; font-weight: bold; text-align: center; margin: 32px 0; color: #4A90D9; }
    .small { font-size: ${footnote_size}px; color: #888; }
    .image-placeholder { color: #999; text-align: center; padding: 40px; background: #f9f9f9; margin: 16px 0; }
    .image-wrap { text-align: center; margin: 16px 0; }
    .blog-image { max-width: 100%; height: auto; display: block; margin: 0 auto; }
    .tags { color: #4A90D9; margin-top: 32px; }
  </style>
</head>
<body>

<h1>${title}</h1>

${thumbnail_html}

<hr>
${sections_html}

<p class="tags">${tags}</p>

</body>
</html>
